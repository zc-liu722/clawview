services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      CLAWVIEW_ALLOWED_ORIGIN: ${CLAWVIEW_ALLOWED_ORIGIN:-http://localhost:3000}
      CLAWVIEW_AGENT_ID: ${CLAWVIEW_AGENT_ID:-agent_local}
      CLAWVIEW_AGENT_NAME: ${CLAWVIEW_AGENT_NAME:-我的 OpenClaw}
      CLAWVIEW_DATA_SOURCE: ${CLAWVIEW_DATA_SOURCE:-openclaw}
      CLAWVIEW_OPENCLAW_HOME: /data/openclaw
      CLAWVIEW_PORT: 8787
    expose:
      - "8787"
    restart: unless-stopped
    volumes:
      - ${CLAWVIEW_OPENCLAW_HOME:-~/.openclaw}:/data/openclaw:ro

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - server
    ports:
      - "${CLAWVIEW_WEB_PORT:-3000}:80"
    restart: unless-stopped
