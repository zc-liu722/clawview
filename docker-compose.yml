services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      CLAWVIEW_ALLOWED_ORIGIN: ${CLAWVIEW_ALLOWED_ORIGIN:-http://localhost:3000}
      CLAWVIEW_AGENT_ID: ${CLAWVIEW_AGENT_ID:-agent_local}
      CLAWVIEW_AGENT_NAME: ${CLAWVIEW_AGENT_NAME:-我的 OpenClaw}
      CLAWVIEW_DATA_SOURCE: ${CLAWVIEW_DATA_SOURCE:-openclaw}
      CLAWVIEW_ENABLE_OPENCLAW_CLI: ${CLAWVIEW_ENABLE_OPENCLAW_CLI:-false}
      CLAWVIEW_CLAWD_DIR: /data/clawd
      CLAWVIEW_OPENCLAW_HOME: /data/openclaw
      CLAWVIEW_OPENCLAW_BIN: ${CLAWVIEW_OPENCLAW_BIN:-openclaw}
      CLAWVIEW_OPENCLAW_LOG_DIR: ${CLAWVIEW_OPENCLAW_LOG_DIR:-}
      CLAWVIEW_GATEWAY_RESTART_COMMAND: ${CLAWVIEW_GATEWAY_RESTART_COMMAND:-}
      CLAWVIEW_GATEWAY_USAGE_COMMAND: ${CLAWVIEW_GATEWAY_USAGE_COMMAND:-}
      CLAWVIEW_PORT: 8787
    expose:
      - "8787"
    restart: unless-stopped
    volumes:
      - ${CLAWVIEW_OPENCLAW_HOME}:/data/openclaw:ro
      - ${CLAWVIEW_CLAWD_DIR}:/data/clawd

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - server
    ports:
      - "${CLAWVIEW_WEB_PORT:-3000}:80"
    restart: unless-stopped
